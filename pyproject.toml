[project]
name = "nccu-moodle-mcp"
version = "0.1.0"
description = "MCP server exposing NCCU Moodle (moodle45.nccu.edu.tw) via SSO login"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "requests>=2.32",
    "beautifulsoup4>=4.13",
]

[project.scripts]
nccu-moodle-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat single-file modules (not a package directory).
include = ["server.py", "moodle_client.py", "client.py"]
