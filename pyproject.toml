[project]
name = "nccu-moodle-mcp"
version = "0.1.0"
description = "MCP server exposing NCCU Moodle (moodle.nccu.edu.tw) via SSO login"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "requests>=2.32",
    "beautifulsoup4>=4.13",
]

[project.scripts]
nccu-moodle-mcp = "nccu_moodle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nccu_moodle_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "scripts"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E), import sorting (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "I", "UP", "B"]
